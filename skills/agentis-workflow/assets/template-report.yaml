# Vzor: stáhni data → nech agenta napsat report → přilož artefakt → pošli e-mailem.
# Nahraď image, envFiles a příjemce vlastními hodnotami. Tajné hodnoty (SMTP, API klíče) patří do envFiles
# nebo do env procesu (`spec.pass_env`), nikdy do YAML.
# Pokud projekt má `_base.yaml`, nahraď infrastrukturní blok řádkem `extends: _base`.
version: 1
workflow:
  executor: docker
  image: registry.example.com/tools:1.0
  workingDir: "[%WORKDIR%]"
  timeoutSeconds: 3600
  envFiles:
    - /etc/agentis-workflow/report.env   # SMTP_*, EMAIL_FROM, API klíče — ověř, že tam jsou
  env:
    REPORT_SOURCE_URL: https://example.com/source
    REPORT_MODEL: openai/gpt-5.4-mini
    REPORT_EMAIL_TO: someone@example.com
    REPORT_SUBJECT: Report
  steps:
    - name: Fetch data
      retries: 2
      run: |
        mkdir -p outputs
        curl -fsSL "$REPORT_SOURCE_URL" -o outputs/source.html
        test -s outputs/source.html

    - name: Write report
      agent:
        adapter: opencode
        model: "$REPORT_MODEL"
        promptFile: ${WORKDIR}/prompts/report.md
        inputs:
          - label: "Zdrojová data:"
            path: ${WORKDIR}/outputs/source.html
        output: ${WORKDIR}/outputs/report.html
      outputs:
        - type: artifact
          name: report.html
          path: outputs/report.html

    - name: Send report email
      run: |
        python3 - <<'PY'
        import os
        import smtplib
        from email.message import EmailMessage
        from pathlib import Path

        body = Path("outputs/report.html").read_text(encoding="utf-8").strip()
        # LLM občas obalí HTML do ```html bloku — odstraň ho.
        lines = body.splitlines()
        if lines and lines[0].strip().lower() in {"```html", "```"}:
            lines = lines[1:-1] if lines[-1].strip() == "```" else lines[1:]
            body = "\n".join(lines).strip()

        msg = EmailMessage()
        msg["From"] = os.getenv("EMAIL_FROM", "agent@example.com")
        msg["To"] = os.environ["REPORT_EMAIL_TO"]
        msg["Subject"] = os.environ["REPORT_SUBJECT"]
        msg.set_content("Report je ve formátu HTML.")
        msg.add_alternative(body, subtype="html")

        host = os.getenv("SMTP_SERVER", os.getenv("SMTP_HOST", "localhost"))
        with smtplib.SMTP(host, int(os.getenv("SMTP_PORT", "25"))) as smtp:
            smtp.send_message(msg)
        PY
