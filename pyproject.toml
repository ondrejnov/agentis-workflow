[tool.poetry]
name = "agentis-workflow"
version = "0.1.0"
description = "Declarative YAML workflow engine (local, Docker and Kubernetes executors)"
packages = [
    { include = "agentis_workflow" },
]

[tool.poetry.scripts]
agentis-workflow = "agentis_workflow.cli:main"

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
pydantic = "^2.10.6"
pyyaml = "^6.0.3"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
ruff = "^0.14.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
